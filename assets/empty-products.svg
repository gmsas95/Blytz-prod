<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" stroke="#ccc" stroke-width="2"/>
  
  <!-- Shopping bag -->
  <path d="M60 120 L60 80 C60 70 65 65 75 65 L85 65 C85 60 90 55 100 55 C110 55 115 60 115 65 L125 65 C135 65 140 70 140 80 L140 120 Z" fill="#ddd" stroke="#bbb" stroke-width="2"/>
  
  <!-- Bag handles -->
  <path d="M75 65 C75 55 85 50 100 50 C115 50 125 55 125 65" fill="none" stroke="#bbb" stroke-width="2"/>
  
  <!-- Search magnifying glass -->
  <circle cx="70" cy="130" r="8" fill="none" stroke="#bbb" stroke-width="3"/>
  <line x1="76" y1="136" x2="85" y2="145" stroke="#bbb" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Question mark -->
  <g transform="translate(130, 130)">
